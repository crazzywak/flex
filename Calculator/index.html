<!DOCTYPE html>
<html lang="ru" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор месячной зарплаты брутто</title>

  <!-- Apply the saved language before first paint to avoid a flash of the wrong direction -->
  <script>
    (function () {
      try {
        var lang = localStorage.getItem('calculator.lang');
        // Russian is the default; Hebrew only if the user chose it last time
        if (lang === 'he') {
          document.documentElement.lang = 'he';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) { /* storage unavailable */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300..800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-text">
        <h1 class="title" data-i18n="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
      <div class="header-side">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="he" lang="he">עברית</button>
          <button type="button" class="lang-btn" data-lang="ru" lang="ru">Русский</button>
        </div>
        <img src="logo.png" alt="" class="logo" data-i18n-alt="logoAlt">
      </div>
    </header>

    <!-- INPUT CARD -->
    <section class="card">
      <div class="toolbar">
        <div class="segmented" role="tablist">
          <button type="button" id="baseModeBtn" class="segment active" role="tab" onclick="switchMode('base')"
            data-i18n="modeHourly"></button>
          <button type="button" id="targetModeBtn" class="segment" role="tab" onclick="switchMode('target')"
            data-i18n="modeTarget"></button>
        </div>
        <button type="button" class="btn-ghost" onclick="clearAll()" data-i18n="clear"></button>
      </div>

      <form class="input-row" id="calcForm" novalidate onsubmit="event.preventDefault(); calculate();">
        <label class="field" for="amount">
          <span class="field-label" id="amountLabel"></span>
          <span class="input-wrap">
            <input type="number" id="amount" step="0.01" min="0" inputmode="decimal" autocomplete="off">
            <span class="input-suffix">₪</span>
          </span>
        </label>
        <button type="submit" class="btn-primary" data-i18n="calculate"></button>
      </form>
      <div class="error" id="error" role="alert"></div>
    </section>

    <!-- RESULTS -->
    <section class="card results" id="results" hidden>
      <div class="section-head">
        <h2 class="section-title" id="resultsTitle"></h2>
        <span class="hint" data-i18n="clickHint"></span>
      </div>
      <div class="scenario-list" id="scenarioList"></div>
    </section>

    <!-- DAILY BREAKDOWN -->
    <section class="card" id="dailyDetails" hidden>
      <h2 class="section-title" data-i18n="breakdownTitle"></h2>
      <div id="dailyBreakdown"></div>
    </section>

    <!-- NOTES -->
    <section class="note">
      <strong data-i18n="conditions"></strong>
      <ul>
        <li data-i18n="cond1"></li>
        <li data-i18n="cond2"></li>
      </ul>
    </section>

  </main>

  <script>
    /* ---------- TRANSLATIONS ---------- */

    const I18N = {
      he: {
        locale: 'he-IL',
        dir: 'rtl',
        title: 'מחשבון משכורת חודשי ברוטו',
        subtitle: 'חישוב שכר לפי סוג משמרות',
        logoAlt: 'לוגו החברה',
        clear: 'נקה',
        modeHourly: 'שכר שעתי',
        modeTarget: 'משכורת חודשית רצויה',
        labelHourly: 'משכורת שעתית',
        labelTarget: 'משכורת חודשית רצויה',
        calculate: 'חשב',
        errorHourly: 'יש להזין שכר שעתי תקין.',
        errorTarget: 'יש להזין משכורת חודשית רצויה תקינה.',
        resultsMonthly: 'משכורת חודשית לפי סידור',
        resultsHourly: 'שכר שעתי נדרש לפי סידור',
        clickHint: 'לחץ על שורה לפירוט לפי יום',
        scenario0: 'בוקר בלבד ללא שעות נוספות',
        scenario1: 'שבוע בוקר + 3 ש"נ בשבוע',
        scenario3: 'שבוע בוקר/שבוע לילה',
        scenario2: 'שבוע בוקר עם 5 ש"נ',
        scenario2Note: 'מחלקת SMT בוקר',
        scenario4: 'חודש עם שבוע אחד של לילות',
        scenario4Note: 'מחלקת SMT 3 תחת ודים קנסבקי',
        perMonth: 'לחודש',
        perHour: 'לשעה',
        breakdownTitle: 'פירוט שכר לפי יום',
        hourlyRate: 'שכר שעתי',
        colDay: 'יום',
        colType: 'סוג',
        colHours: 'שעות',
        colPay: 'שכר',
        week: n => `שבוע ${n}`,
        fridays: 'ימי שישי',
        total: 'סה"כ',
        dayN: n => `יום ${n}`,
        overtimeN: n => `ש"נ ${n}`,
        extraDayN: n => `יום נוסף ${n}`,
        typeMorning: 'בוקר',
        typeNight: 'לילה',
        typeOvertime: 'שעות נוספות',
        typeMorningOvertime: 'בוקר+שעות נוספות',
        conditions: 'תנאים:',
        cond1: '22 ימי עבודה בחודש כולל שישי פעמיים בחודש',
        cond2: 'שעות נוספות יש רק במשמרות בוקר'
      },
      ru: {
        locale: 'ru-RU',
        dir: 'ltr',
        title: 'Калькулятор месячной зарплаты брутто',
        subtitle: 'Расчёт зарплаты по типу смен',
        logoAlt: 'Логотип компании',
        clear: 'Очистить',
        modeHourly: 'Почасовая ставка',
        modeTarget: 'Желаемая зарплата',
        labelHourly: 'Почасовая ставка',
        labelTarget: 'Желаемая месячная зарплата',
        calculate: 'Рассчитать',
        errorHourly: 'Введите корректную почасовую ставку.',
        errorTarget: 'Введите корректную желаемую месячную зарплату.',
        resultsMonthly: 'Месячная зарплата по графику',
        resultsHourly: 'Необходимая почасовая ставка по графику',
        clickHint: 'Нажмите на строку, чтобы увидеть расчёт по дням',
        scenario0: 'Только утро, без сверхурочных',
        scenario1: 'Утренняя неделя + 3 сверхурочных в неделю',
        scenario3: 'Неделя утро / неделя ночь',
        scenario2: 'Утренняя неделя с 5 сверхурочными',
        scenario2Note: 'Отдел SMT, утро',
        scenario4: 'Месяц с одной ночной неделей',
        scenario4Note: 'Отдел SMT 3, под руководством Вадима Каневского',
        perMonth: 'в месяц',
        perHour: 'в час',
        breakdownTitle: 'Расчёт зарплаты по дням',
        hourlyRate: 'Почасовая ставка',
        colDay: 'День',
        colType: 'Тип',
        colHours: 'Часы',
        colPay: 'Оплата',
        week: n => `Неделя ${n}`,
        fridays: 'Пятницы',
        total: 'Итого',
        dayN: n => `День ${n}`,
        overtimeN: n => `Сверхур. ${n}`,
        extraDayN: n => `Доп. день ${n}`,
        typeMorning: 'Утро',
        typeNight: 'Ночь',
        typeOvertime: 'Сверхурочные',
        typeMorningOvertime: 'Утро + сверхурочные',
        conditions: 'Условия:',
        cond1: '22 рабочих дня в месяц, включая две пятницы',
        cond2: 'Сверхурочные бывают только в утренние смены'
      }
    };

    const LANG_KEY = 'calculator.lang';

    function loadLang() {
      try {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved && I18N[saved]) return saved;
      } catch (e) { /* storage unavailable */ }
      return 'ru';
    }

    function saveLang(lang) {
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable */ }
    }

    let lang = loadLang();
    const t = key => I18N[lang][key];

    /* ---------- CONSTANTS (hour-based, multiplier-based) ---------- */

    const REGULAR_WEEK_BASE_HOURS = (4 * 8.6) + 7.6;

    // Extra hours (per day)
    function extraDayPay(base) {
      return (2 * base * 1.25) + (1 * base * 1.5);
    }

    function extraDayPayFriday(base) {
      return (2 * base * 1.25) + (4 * base * 1.5);
    }

    // Night shift (12 hours)
    function nightDayPay(base) {
      return (
        (3 * base * 1.0) +
        (4 * base * 1.425) +
        (2 * base * 1.781) +
        (3 * base * 2.137)
      );
    }

    /* ---------- MONTHLY CALCULATION PER SCENARIO ---------- */

    function calculateMorningOnly(base) {
      let total = 0;
      for (let week = 1; week <= 4; week++) {
        total += REGULAR_WEEK_BASE_HOURS * base;
      }
      return total;
    }

    function calculateMorningWithThreeExtra(base) {
      let total = 0;
      for (let week = 1; week <= 4; week++) {
        total += REGULAR_WEEK_BASE_HOURS * base;
        total += 3 * extraDayPay(base);
      }
      // +1 extra regular day (30-day month)
      total += extraDayPayFriday(base);
      return total;
    }

    function calculateMorningWithFiveExtra(base) {
      let total = 0;
      for (let week = 1; week <= 4; week++) {
        total += REGULAR_WEEK_BASE_HOURS * base;
        total += 5 * extraDayPay(base);
      }
      // +2 extra regular days (30-day month)
      total += 2 * extraDayPayFriday(base);
      return total;
    }

    function calculateAlternatingMorningNight(base) {
      let total = 0;
      for (let week = 1; week <= 4; week++) {
        if (week % 2 === 0) {
          // Night week
          total += 5 * nightDayPay(base);
        } else {
          // Morning week
          total += REGULAR_WEEK_BASE_HOURS * base;
          total += ((week === 3) ? 3 : 2) * extraDayPay(base);
        }
      }
      // +2 extra regular days (30-day month)
      total += 2 * extraDayPayFriday(base);
      return total;
    }

    function calculateOneNightWeek(base) {
      let total = 0;
      for (let week = 1; week <= 4; week++) {
        if (week === 2) {
          // One night week (week 2)
          total += 5 * nightDayPay(base);
        } else {
          // Morning weeks
          total += REGULAR_WEEK_BASE_HOURS * base;
          total += ((week === 3) ? 3 : 2) * extraDayPay(base);
        }
      }
      // +2 extra regular days (30-day month)
      total += 2 * extraDayPayFriday(base);
      return total;
    }

    /* ---------- DAILY BREAKDOWN PER SCENARIO ---------- */
    // Each day: { type, kind, n, hours, pay, week }. Labels are translated at render time.

    function morningWeekDays(base, week) {
      const days = [];
      for (let day = 1; day <= 4; day++) {
        days.push({ type: 'Morning', kind: 'day', n: day, hours: 8.6, pay: 8.6 * base, week });
      }
      // Thursday (7.6 hours)
      days.push({ type: 'Morning', kind: 'day', n: 5, hours: 7.6, pay: 7.6 * base, week });
      return days;
    }

    function overtimeDays(base, week, count) {
      const days = [];
      for (let day = 1; day <= count; day++) {
        days.push({ type: 'Overtime', kind: 'overtime', n: day, hours: 3, pay: extraDayPay(base), week });
      }
      return days;
    }

    function nightWeekDays(base, week) {
      const days = [];
      for (let day = 1; day <= 5; day++) {
        days.push({ type: 'Night', kind: 'day', n: day, hours: 12, pay: nightDayPay(base), week });
      }
      return days;
    }

    function fridayDays(base, count) {
      const days = [];
      for (let i = 1; i <= count; i++) {
        days.push({ type: 'MorningOvertime', kind: 'extra', n: i, hours: 6, pay: extraDayPayFriday(base), week: null });
      }
      return days;
    }

    function getDailyBreakdownMorningOnly(base) {
      const days = [];
      for (let week = 1; week <= 4; week++) {
        days.push(...morningWeekDays(base, week));
      }
      return days;
    }

    function getDailyBreakdownMorningWithThreeExtra(base) {
      const days = [];
      for (let week = 1; week <= 4; week++) {
        days.push(...morningWeekDays(base, week), ...overtimeDays(base, week, 3));
      }
      days.push(...fridayDays(base, 1));
      return days;
    }

    function getDailyBreakdownMorningWithFiveExtra(base) {
      const days = [];
      for (let week = 1; week <= 4; week++) {
        days.push(...morningWeekDays(base, week), ...overtimeDays(base, week, 5));
      }
      days.push(...fridayDays(base, 2));
      return days;
    }

    function getDailyBreakdownAlternatingMorningNight(base) {
      const days = [];
      for (let week = 1; week <= 4; week++) {
        if (week % 2 === 0) {
          days.push(...nightWeekDays(base, week));
        } else {
          // Extra days (week 1: 2, week 3: 3)
          days.push(...morningWeekDays(base, week), ...overtimeDays(base, week, week === 3 ? 3 : 2));
        }
      }
      days.push(...fridayDays(base, 2));
      return days;
    }

    function getDailyBreakdownOneNightWeek(base) {
      const days = [];
      for (let week = 1; week <= 4; week++) {
        if (week === 2) {
          days.push(...nightWeekDays(base, week));
        } else {
          // Extra days (week 1: 2, week 3: 3, week 4: 2)
          days.push(...morningWeekDays(base, week), ...overtimeDays(base, week, week === 3 ? 3 : 2));
        }
      }
      days.push(...fridayDays(base, 2));
      return days;
    }

    /* ---------- SCENARIOS (in display order) ---------- */

    const SCENARIOS = [
      { id: 0, calc: calculateMorningOnly, breakdown: getDailyBreakdownMorningOnly },
      { id: 1, calc: calculateMorningWithThreeExtra, breakdown: getDailyBreakdownMorningWithThreeExtra, accent: 'orange' },
      { id: 3, calc: calculateAlternatingMorningNight, breakdown: getDailyBreakdownAlternatingMorningNight, accent: 'green' },
      { id: 2, calc: calculateMorningWithFiveExtra, breakdown: getDailyBreakdownMorningWithFiveExtra, note: 'scenario2Note' },
      { id: 4, calc: calculateOneNightWeek, breakdown: getDailyBreakdownOneNightWeek, note: 'scenario4Note' }
    ];

    const scenarioById = id => SCENARIOS.find(s => s.id === id);

    /* ---------- STATE ---------- */

    let mode = 'base';        // 'base' = hourly rate given, 'target' = desired monthly salary given
    let inputValue = 0;       // last valid calculated input
    let selectedRow = null;

    /* ---------- FORMATTING ---------- */

    function money(value) {
      return new Intl.NumberFormat(t('locale'), {
        style: 'currency',
        currency: 'ILS',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function num(value) {
      return new Intl.NumberFormat(t('locale'), { maximumFractionDigits: 2 }).format(value);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Hourly rate used for a given scenario's daily breakdown
    function hourlyRateFor(scenario) {
      return mode === 'target' ? inputValue / scenario.calc(1) : inputValue;
    }

    /* ---------- RENDERING ---------- */

    function applyStaticTexts() {
      const root = document.documentElement;
      root.lang = lang;
      root.dir = t('dir');
      document.title = t('title');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-alt]').forEach(el => {
        el.alt = t(el.dataset.i18nAlt);
      });
      document.querySelectorAll('.lang-btn').forEach(btn => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active);
      });

      document.getElementById('amountLabel').textContent = t(mode === 'base' ? 'labelHourly' : 'labelTarget');
    }

    function renderResults() {
      const results = document.getElementById('results');
      if (inputValue <= 0) {
        results.hidden = true;
        return;
      }

      document.getElementById('resultsTitle').textContent = t(mode === 'base' ? 'resultsMonthly' : 'resultsHourly');
      const unit = t(mode === 'base' ? 'perMonth' : 'perHour');

      document.getElementById('scenarioList').innerHTML = SCENARIOS.map(s => {
        const value = mode === 'base' ? s.calc(inputValue) : inputValue / s.calc(1);
        const classes = ['scenario'];
        if (s.accent) classes.push(`accent-${s.accent}`);
        if (s.id === selectedRow) classes.push('selected');
        return `
          <button type="button" class="${classes.join(' ')}" onclick="selectRow(${s.id})"
            aria-pressed="${s.id === selectedRow}">
            <span class="scenario-name">
              ${escapeHtml(t('scenario' + s.id))}
              ${s.note ? `<small>${escapeHtml(t(s.note))}</small>` : ''}
            </span>
            <span class="scenario-value">
              <bdi>${money(value)}</bdi>
              <small>${escapeHtml(unit)}</small>
            </span>
          </button>`;
      }).join('');

      results.hidden = false;
    }

    function renderBreakdown() {
      const details = document.getElementById('dailyDetails');
      const scenario = selectedRow !== null && inputValue > 0 ? scenarioById(selectedRow) : null;
      if (!scenario) {
        details.hidden = true;
        document.getElementById('dailyBreakdown').innerHTML = '';
        return;
      }

      const base = hourlyRateFor(scenario);
      const days = scenario.breakdown(base);

      const label = day => {
        if (day.kind === 'overtime') return t('overtimeN')(day.n);
        if (day.kind === 'extra') return t('extraDayN')(day.n);
        return t('dayN')(day.n);
      };

      const separator = text => `<tr class="separator"><td colspan="4">${escapeHtml(text)}</td></tr>`;

      let rows = '';
      days.forEach((day, index) => {
        const prev = index > 0 ? days[index - 1] : null;
        if (!prev) {
          rows += separator(t('week')(day.week));
        } else if (day.week !== null && prev.week !== null && day.week !== prev.week) {
          rows += separator(t('week')(day.week));
        } else if (day.week === null && prev.week !== null) {
          rows += separator(t('fridays'));
        }

        rows += `
          <tr class="type-${day.type.toLowerCase()}">
            <td>${escapeHtml(label(day))}</td>
            <td><span class="tag">${escapeHtml(t('type' + day.type))}</span></td>
            <td class="num">${num(day.hours)}</td>
            <td class="num pay"><bdi>${money(day.pay)}</bdi></td>
          </tr>`;
      });

      const totalPay = days.reduce((sum, day) => sum + day.pay, 0);
      const totalHours = days.reduce((sum, day) => sum + day.hours, 0);

      document.getElementById('dailyBreakdown').innerHTML = `
        <div class="breakdown-head">
          <span class="breakdown-name">
            ${escapeHtml(t('scenario' + scenario.id))}
            ${scenario.note ? `<small>${escapeHtml(t(scenario.note))}</small>` : ''}
          </span>
          <span class="breakdown-rate">${escapeHtml(t('hourlyRate'))}: <bdi>${money(base)}</bdi></span>
        </div>
        <div class="table-wrap">
          <table class="breakdown">
            <thead>
              <tr>
                <th>${escapeHtml(t('colDay'))}</th>
                <th>${escapeHtml(t('colType'))}</th>
                <th class="num">${escapeHtml(t('colHours'))}</th>
                <th class="num">${escapeHtml(t('colPay'))}</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr>
                <td colspan="2">${escapeHtml(t('total'))}</td>
                <td class="num">${num(totalHours)}</td>
                <td class="num pay"><bdi>${money(totalPay)}</bdi></td>
              </tr>
            </tfoot>
          </table>
        </div>`;

      details.hidden = false;
    }

    function renderAll() {
      applyStaticTexts();
      renderResults();
      renderBreakdown();
    }

    /* ---------- HANDLERS ---------- */

    function setLanguage(newLang) {
      if (!I18N[newLang] || newLang === lang) return;
      lang = newLang;
      saveLang(lang);
      // Re-show an existing error in the new language
      const error = document.getElementById('error');
      if (error.textContent) error.textContent = t(mode === 'base' ? 'errorHourly' : 'errorTarget');
      renderAll();
    }

    function switchMode(newMode) {
      clearAll();
      mode = newMode;
      document.getElementById('baseModeBtn').classList.toggle('active', mode === 'base');
      document.getElementById('targetModeBtn').classList.toggle('active', mode === 'target');
      document.getElementById('baseModeBtn').setAttribute('aria-selected', mode === 'base');
      document.getElementById('targetModeBtn').setAttribute('aria-selected', mode === 'target');
      applyStaticTexts();
      document.getElementById('amount').focus();
    }

    function calculate() {
      const value = parseFloat(document.getElementById('amount').value);
      const error = document.getElementById('error');

      if (isNaN(value) || value <= 0) {
        error.textContent = t(mode === 'base' ? 'errorHourly' : 'errorTarget');
        inputValue = 0;
        selectedRow = null;
        renderResults();
        renderBreakdown();
        return;
      }

      error.textContent = '';
      inputValue = value;
      renderResults();
      renderBreakdown();
    }

    function selectRow(rowId) {
      selectedRow = rowId;
      renderResults();
      renderBreakdown();
      document.getElementById('dailyDetails').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearAll() {
      document.getElementById('amount').value = '';
      document.getElementById('error').textContent = '';
      inputValue = 0;
      selectedRow = null;
      renderResults();
      renderBreakdown();
    }

    /* ---------- INIT ---------- */

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    renderAll();
  </script>

</body>

</html>
